name: local-infra-control-center

services:
  control-center:
    build:
      context: .
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      COMPOSE_PROJECT_NAME: local-infra
      # Keep this path identical on the Docker host and in this container.
      COMPOSE_FILE: ${WORKSPACE_HOST_PATH:-${PWD}}/docker-compose.yml
      CONTROL_CENTER_SERVICES: ${CONTROL_CENTER_SERVICES:-}
      WORKSPACE_DIR: ${WORKSPACE_HOST_PATH:-${PWD}}
      TASK_DB_PATH: /var/lib/control-center/control-center.sqlite
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      DATASTORE_EMULATOR_HOST: datastore:8085
      DATASTORE_PROJECT_ID: local-project
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPANNER_EMULATOR_HOST: spanner:9010
      SPANNER_PROJECT_ID: local-project
      SPANNER_INSTANCE_ID: local-instance
      SPANNER_DATABASE_ID: local-database
      KAFKA_UI_INTERNAL_URL: http://kafka-ui:8080
      KAFKA_UI_OPEN_URL: ${KAFKA_UI_OPEN_URL:-}
      REDASH_INTERNAL_URL: http://redash:5000
      REDASH_OPEN_URL: ${REDASH_OPEN_URL:-}
      TRUST_CODER_PROXY: ${TRUST_CODER_PROXY:-true}
      CODER_ACTOR_HEADER: ${CODER_ACTOR_HEADER:-x-coder-user}
      # Cross-origin development clients. Override with a comma-separated list when needed.
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - '3000:3000'
      - '8090:8090'
      - '8091:8091'
      - '8092:8092'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACE_HOST_PATH:-${PWD}}:${WORKSPACE_HOST_PATH:-${PWD}}
      - control-center-data:/var/lib/control-center
    networks:
      - local-infra

volumes:
  control-center-data:

networks:
  local-infra:
    external: true
    name: local-infra_default
