name: local-infra

services:
  mysql:
    image: mysql:5.7
    container_name: mysql-share
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-proot']
      interval: 10s
      timeout: 5s
      retries: 10

  # Interactive Google Cloud SDK shell. Run: docker compose run --rm gcloud --help
  gcloud:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    container_name: gcloud-share
    profiles: ['tools']
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - gcloud-config:/root/.config/gcloud
    entrypoint: ['gcloud']

  # Google Cloud Datastore emulator.
  datastore:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    container_name: datastore
    command:
      - gcloud
      - beta
      - emulators
      - datastore
      - start
      - --project=local-project
      - --host-port=0.0.0.0:8085
    ports:
      - '8085:8085'

  kafka:
    image: apache/kafka:3.9.0
    container_name: local-kafka
    # The named volume is initialized as root-owned; Kafka needs write access to format KRaft metadata.
    user: '0:0'
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - '9094:9094'
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: local-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - '8080:8080'

  redash-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: redash
      POSTGRES_PASSWORD: redash
      POSTGRES_DB: redash
    volumes:
      - redash-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U redash -d redash']
      interval: 5s
      timeout: 5s
      retries: 20

  redash-redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redash-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  redash-init:
    image: redash/redash:10.1.0.b50633
    depends_on:
      redash-postgres:
        condition: service_healthy
      redash-redis:
        condition: service_healthy
    environment: &redash-env
      REDASH_DATABASE_URL: postgresql://redash:redash@redash-postgres/redash
      REDASH_REDIS_URL: redis://redash-redis:6379/0
      REDASH_COOKIE_SECRET: local-redash-cookie-secret-change-for-shared-environments
      REDASH_LOG_LEVEL: INFO
      REDASH_FRAME_OPTIONS: ''
      REDASH_CONTENT_SECURITY_POLICY: "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; font-src 'self' data:; img-src 'self' http: https: data: blob:; object-src 'none'; frame-ancestors *; frame-src redash.io;"
    command: create_db
    restart: 'no'

  redash-worker:
    image: redash/redash:10.1.0.b50633
    depends_on:
      redash-init:
        condition: service_completed_successfully
    environment: *redash-env
    command: worker
    restart: unless-stopped

  redash:
    image: redash/redash:10.1.0.b50633
    container_name: local-redash
    depends_on:
      redash-init:
        condition: service_completed_successfully
      redash-worker:
        condition: service_started
    environment: *redash-env
    command: server
    restart: unless-stopped
    ports:
      - '5000:5000'

  spanner:
    image: gcr.io/cloud-spanner-emulator/emulator:latest
    container_name: local-spanner
    restart: unless-stopped
    ports:
      - '9010:9010'
      - '9020:9020'

volumes:
  mysql-data:
  kafka-data:
  gcloud-config:
  redash-postgres-data:
  redash-redis-data:
